name: Auto-Update Documentation

on:
  push:
    branches: [main]
    paths:
      - 'backend/**/*.py'
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Get changed files
        run: |
          git diff --name-only HEAD^ HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Update documentation
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          droid exec --auto high "
          The following source files were just merged to main:
          $(cat changed_files.txt)

          Update the documentation to reflect the code changes.

          Specifically:
          1. Search README.md and docs/ for references to the changed remediation
             logic (especially calculate_reserved_concurrency and the Lambda
             throttling playbook).
          2. Update examples, descriptions, return-type notes, and operational
             guidance if behaviour changed.
          3. Preserve the existing documentation style and section structure.
          4. Only modify documentation that is actually affected by the change.
          5. Create doc-update-summary.md at the repo root explaining what changed
             and why, in 3-6 bullet points.
          6. Do not commit or push changes — the workflow handles git operations.
          "

      - name: Commit documentation updates
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "factory-droid[bot]"
            git config user.email "138933559+factory-droid[bot]@users.noreply.github.com"
            BRANCH="docs/factory-update-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "docs: update remediation guidance

          Automated documentation update generated by Factory Droid in response
          to recent changes under backend/.

          Co-authored-by: factory-droid[bot] <138933559+factory-droid[bot]@users.noreply.github.com>"
            git push origin "$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No documentation changes needed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure PR labels exist
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create documentation --color 0075ca --description "Documentation changes" --force
          gh label create automated --color ededed --description "Created by an automated workflow" --force

      - name: Create documentation PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY=$(cat doc-update-summary.md 2>/dev/null || echo "Documentation updated to reflect recent code changes.")
          gh pr create \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "docs: automated remediation documentation update" \
            --body "$SUMMARY" \
            --label "documentation,automated"
